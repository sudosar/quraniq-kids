<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Hilal the moon">
  <defs>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="200" height="200" fill="#fff"/>
      <circle cx="132" cy="78" r="62" fill="#000"/>
    </mask>
  </defs>
  <circle cx="92" cy="104" r="74" fill="url(#moon)" mask="url(#crescent)"/>
  <!-- face, sitting in the thick part of the crescent -->
  <ellipse cx="58" cy="112" rx="6" ry="8" fill="#5D4037"/>
  <ellipse cx="82" cy="138" rx="6" ry="8" fill="#5D4037"/>
  <circle cx="60" cy="109" r="2" fill="#fff"/>
  <circle cx="84" cy="135" r="2" fill="#fff"/>
  <path d="M52 140 q14 22 36 16" fill="none" stroke="#5D4037" stroke-width="5" stroke-linecap="round"/>
  <circle cx="46" cy="132" r="7" fill="#E8567F" opacity=".45"/>
  <circle cx="96" cy="158" r="7" fill="#E8567F" opacity=".45"/>
  <!-- sparkle -->
  <path d="M158 140 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#FFF3C4"/>
</svg>
